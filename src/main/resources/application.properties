spring.application.name=incident-backend
spring.cache.type=simple

# JWT Configuration — loaded from env; fallback is intentionally weak to force override in production
jwt.secret=${JWT_SECRET:CHANGE_ME_IN_PRODUCTION_min32chars!!}
jwt.expiration.access=${JWT_ACCESS_EXPIRY:86400000}
jwt.expiration.refresh=${JWT_REFRESH_EXPIRY:604800000}

# OTP Configuration — never expose OTP in responses in production (override with OTP_EXPOSE=true for dev only)
app.otp.expose-in-response=${OTP_EXPOSE:false}
app.otp.rate-limit-seconds=${OTP_RATE_LIMIT:60}
app.otp.max-failed-attempts=${OTP_MAX_ATTEMPTS:5}
app.otp.lockout-minutes=${OTP_LOCKOUT_MINUTES:15}

# SMS (Africa's Talking) — OTP delivery. Defaults point at the free sandbox; override for production.
app.sms.enabled=${SMS_ENABLED:true}
app.sms.default-country-code=${SMS_DEFAULT_COUNTRY_CODE:255}
africastalking.username=${AT_USERNAME:sandbox}
africastalking.api-key=${AT_API_KEY:}
africastalking.sender-id=${AT_SENDER_ID:}
africastalking.base-url=${AT_BASE_URL:https://api.sandbox.africastalking.com/version1/messaging}

# Database — loaded from environment; hard-coded fallback is for local dev only
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/incidentDb}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:salap3938}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# GraphQL SPQR disabled — using REST API
spring.autoconfigure.exclude=io.leangen.graphql.spqr.spring.autoconfigure.BaseAutoConfiguration,io.leangen.graphql.spqr.spring.autoconfigure.WebSocketAutoConfiguration,io.leangen.graphql.spqr.spring.autoconfigure.MvcAutoConfiguration

# CORS — in production set to your actual frontend origins (never leave as * in prod)
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200,http://localhost:3000}

# Seed configuration
app.seed.enabled=true
app.seed.root.phone=${SEED_ROOT_PHONE:+255000000000}
app.seed.root.name=${SEED_ROOT_NAME:System Administrator}
app.seed.root.username=${SEED_ROOT_USERNAME:admin}
app.seed.root.password=${SEED_ROOT_PASSWORD:Admin@1234}

# Media upload
app.upload.dir=${UPLOAD_DIR:uploads}

# Firebase push notifications
app.notification.push.enabled=${PUSH_ENABLED:true}
firebase.config.path=${FIREBASE_CONFIG:firebase-service-account.json}

# AI Triage — Anthropic Claude API key (set via env var ANTHROPIC_API_KEY)
# Falls back to rule-based Swahili/English classification when not set.
anthropic.api.key=${ANTHROPIC_API_KEY:}

# Logging — tightened defaults; override with LOG_LEVEL env var
logging.level.root=${LOG_LEVEL:WARN}
logging.level.com.smartincident=${APP_LOG_LEVEL:INFO}
logging.level.org.springframework.security=${SECURITY_LOG_LEVEL:WARN}
